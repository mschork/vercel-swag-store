<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commerce and content slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --mono: "Geist Mono", ui-monospace, Menlo, monospace; --sans: "Geist", ui-sans-serif, system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  svg { display: block; width: min(100vw, 177.78vh); height: auto; }
  .h1 { font: 600 40px var(--sans); fill: #fff; letter-spacing: -1.4px; }
  .sub { font: 400 17px var(--mono); fill: #a1a1a1; }
  .lane { font: 500 14px var(--mono); fill: #a1a1a1; letter-spacing: 2px; }
  .frame { fill: none; stroke: #2e2e2e; }
  .box rect:first-child { fill: #0a0a0a; stroke: #454545; stroke-width: 1.6; }
  .bt { font: 500 16px var(--mono); fill: #fff; letter-spacing: 1px; }
  .bl { font: 400 17px var(--sans); fill: #a1a1a1; }
  .chip { fill: #161616; stroke: #3a3a3a; }
  .ct { font: 400 12.5px var(--mono); fill: #ededed; }
  .edge { fill: none; stroke: #8f8f8f; stroke-width: 1.6; }
  .edge.dashed { stroke-dasharray: 6 5; }
  .el { font: 400 13px var(--mono); fill: #a1a1a1; paint-order: stroke; stroke: #000; stroke-width: 6px; }
  .num circle { fill: #000; stroke: #fff; stroke-width: 1.6; }
  .num text { font: 500 15px var(--mono); fill: #fff; }
  .rule { stroke: #2e2e2e; }
  .lg { font: 400 15px var(--mono); fill: #a1a1a1; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Commerce and content, one experience</title>
  <desc id="d">Three layers. Experience: the visitor's browser and the editor. Build and render: Next.js 16 on Vercel with a prerendered static shell, dynamic islands streamed in Suspense, and Server Actions for the cart. Platform: GitHub triggers an atomic Vercel build that fills the tagged data cache from the Swag Store API and the Sanity Content Lake; stock, promo and cart come live from the API; publishing in Sanity Studio fires a webhook that revalidates the cache without a redeploy.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8f8f8f"/></marker></defs>

  <text class="h1" x="56" y="96">Commerce and content, one experience</text>
  <text class="sub" x="57" y="130">Vercel runs the store, the Swag Store API owns commerce, Sanity owns content</text>

  <!-- Layer 1: experience -->
  <text class="lane" x="60" y="184">EXPERIENCE</text>
  <rect class="frame" x="56" y="198" width="1488" height="108" rx="16"/>
  <g class="box"><rect x="80" y="212" width="1024" height="80" rx="12"/><text class="bt" x="102" y="244">VISITOR</text><text class="bl" x="102" y="272">home, product detail, search and cart, on any device</text></g>
  <g class="box"><rect x="1216" y="212" width="290" height="80" rx="12"/><text class="bt" x="1238" y="244">EDITOR</text><text class="bl" x="1238" y="272">Studio and live Presentation</text></g>

  <!-- Layer 2: build and render -->
  <text class="lane" x="60" y="350">BUILD AND RENDER · NEXT.JS 16 ON VERCEL</text>
  <rect class="frame" x="56" y="364" width="1488" height="170" rx="16"/>
  <g class="box"><rect x="80" y="380" width="580" height="138" rx="12"/><text class="bt" x="102" y="416">STATIC SHELL</text><text class="bl" x="102" y="444">prerendered at build, served from the edge</text><text class="bl" x="102" y="466">layout, hero, featured grid, product content</text>
    <rect class="chip" x="102" y="484" width="84.4" height="24" rx="12"/><text class="ct" x="144.2" y="500.5" text-anchor="middle">use cache</text>
    <rect class="chip" x="194.4" y="484" width="137.6" height="24" rx="12"/><text class="ct" x="263.2" y="500.5" text-anchor="middle">Cache Components</text>
    <rect class="chip" x="340" y="484" width="168" height="24" rx="12"/><text class="ct" x="424" y="500.5" text-anchor="middle">generateStaticParams</text></g>
  <g class="box"><rect x="684" y="380" width="420" height="138" rx="12"/><text class="bt" x="706" y="416">DYNAMIC ISLANDS</text><text class="bl" x="706" y="444">streamed per request in Suspense</text><text class="bl" x="706" y="466">skeletons hold the layout, no shift</text>
    <rect class="chip" x="706" y="484" width="76.8" height="24" rx="12"/><text class="ct" x="744.4" y="500.5" text-anchor="middle">Suspense</text>
    <rect class="chip" x="790.8" y="484" width="54" height="24" rx="12"/><text class="ct" x="817.8" y="500.5" text-anchor="middle">stock</text>
    <rect class="chip" x="852.8" y="484" width="54" height="24" rx="12"/><text class="ct" x="879.8" y="500.5" text-anchor="middle">promo</text>
    <rect class="chip" x="914.8" y="484" width="92" height="24" rx="12"/><text class="ct" x="960.8" y="500.5" text-anchor="middle">cart badge</text>
    <rect class="chip" x="1014.8" y="484" width="61.6" height="24" rx="12"/><text class="ct" x="1045.6" y="500.5" text-anchor="middle">search</text></g>
  <g class="box"><rect x="1128" y="380" width="370" height="138" rx="12"/><text class="bt" x="1150" y="416">SERVER ACTIONS</text><text class="bl" x="1150" y="444">cart add, update, remove</text><text class="bl" x="1150" y="466">native forms, server-side token</text>
    <rect class="chip" x="1150" y="484" width="114.8" height="24" rx="12"/><text class="ct" x="1207.4" y="500.5" text-anchor="middle">useOptimistic</text>
    <rect class="chip" x="1272.8" y="484" width="130" height="24" rx="12"/><text class="ct" x="1337.8" y="500.5" text-anchor="middle">httpOnly cookie</text></g>

  <!-- Layer 3: platform and data -->
  <text class="lane" x="60" y="578">GITHUB</text>
  <rect class="frame" x="56" y="592" width="220" height="180" rx="16"/>
  <text class="lane" x="300" y="578">VERCEL</text>
  <rect class="frame" x="296" y="592" width="600" height="180" rx="16"/>
  <text class="lane" x="920" y="578">COMMERCE</text>
  <rect class="frame" x="916" y="592" width="260" height="180" rx="16"/>
  <text class="lane" x="1200" y="578">SANITY</text>
  <rect class="frame" x="1196" y="592" width="348" height="180" rx="16"/>

  <g class="box"><rect x="76" y="606" width="180" height="160" rx="12"/><text class="bt" x="98" y="642">REPOSITORY</text><text class="bl" x="98" y="670">store + studio</text><text class="bl" x="98" y="692">one PR per epic</text>
    <rect class="chip" x="98" y="722" width="84.4" height="24" rx="12"/><text class="ct" x="140.2" y="738.5" text-anchor="middle">Turborepo</text></g>
  <g class="box"><rect x="316" y="606" width="250" height="160" rx="12"/><text class="bt" x="338" y="642">VERCEL BUILD</text><text class="bl" x="338" y="670">all or nothing, per push</text><text class="bl" x="338" y="692">preview per PR, rollback</text>
    <rect class="chip" x="338" y="722" width="122.4" height="24" rx="12"/><text class="ct" x="399.2" y="738.5" text-anchor="middle">Atomic deploys</text></g>
  <g class="box"><rect x="626" y="606" width="250" height="160" rx="12"/><text class="bt" x="648" y="642">DATA CACHE</text><text class="bl" x="648" y="670">tagged, long cacheLife</text><text class="bl" x="648" y="692">catalogue and content</text>
    <rect class="chip" x="648" y="722" width="76.8" height="24" rx="12"/><text class="ct" x="686.4" y="738.5" text-anchor="middle">cacheTag</text>
    <rect class="chip" x="732.8" y="722" width="114.8" height="24" rx="12"/><text class="ct" x="790.2" y="738.5" text-anchor="middle">revalidateTag</text></g>
  <g class="box"><rect x="936" y="606" width="220" height="160" rx="12"/><text class="bt" x="958" y="642">SWAG STORE API</text><text class="bl" x="958" y="670">products, stock,</text><text class="bl" x="958" y="692">promo and cart</text>
    <rect class="chip" x="958" y="722" width="145.2" height="24" rx="12"/><text class="ct" x="1030.6" y="738.5" text-anchor="middle">server-only token</text></g>
  <g class="box"><rect x="1216" y="606" width="290" height="66" rx="12"/><text class="bt" x="1238" y="634">STUDIO</text><text class="bl" x="1238" y="658">schemas, API product picker</text></g>
  <g class="box"><rect x="1216" y="696" width="290" height="70" rx="12"/><text class="bt" x="1238" y="724">CONTENT LAKE</text><text class="bl" x="1238" y="750">hero, settings, enrichment</text></g>

  <!-- Build time (dashed) -->
  <path class="edge dashed" d="M256 686 H316" marker-end="url(#a)"/>
  <g class="num"><circle cx="286" cy="660" r="15"/><text x="286" y="665.5" text-anchor="middle">1</text></g>
  <path class="edge dashed" d="M566 686 H626" marker-end="url(#a)"/>
  <g class="num"><circle cx="596" cy="660" r="15"/><text x="596" y="665.5" text-anchor="middle">2</text></g>
  <path class="edge dashed" d="M876 686 H936" marker-end="url(#a)"/>
  <text class="el" x="906" y="676" text-anchor="middle">fetch</text>
  <path class="edge dashed" d="M451 606 V518" marker-end="url(#a)"/>
  <g class="num"><circle cx="451" cy="562" r="15"/><text x="451" y="567.5" text-anchor="middle">3</text></g>

  <!-- Request time (solid) -->
  <path class="edge" d="M645 606 V518" marker-end="url(#a)"/>
  <text class="el" x="657" y="566">cached reads</text>
  <path class="edge" d="M560 292 V380" marker-end="url(#a)" marker-start="url(#a)"/>
  <g class="num"><circle cx="560" cy="336" r="15"/><text x="560" y="341.5" text-anchor="middle">4</text></g>
  <path class="edge" d="M884 292 V380" marker-end="url(#a)" marker-start="url(#a)"/>
  <g class="num"><circle cx="884" cy="336" r="15"/><text x="884" y="341.5" text-anchor="middle">5</text></g>
  <path class="edge" d="M1090 292 V336 H1313 V380" marker-end="url(#a)"/>
  <g class="num"><circle cx="1200" cy="336" r="15"/><text x="1200" y="341.5" text-anchor="middle">6</text></g>
  <path class="edge" d="M1040 518 V606" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="el" x="1030" y="552" text-anchor="end">stock · promo</text>
  <path class="edge" d="M1146 518 V606" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="el" x="1158" y="566">cart</text>
  <path class="edge" d="M1506 252 H1528 V639 H1506" marker-end="url(#a)"/>
  <g class="num"><circle cx="1528" cy="450" r="15"/><text x="1528" y="455.5" text-anchor="middle">7</text></g>
  <path class="edge" d="M1361 672 V696" marker-end="url(#a)"/>
  <path class="edge" d="M1361 766 V788 H751 V766" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="866" y="778" width="380" height="20" fill="#000"/><text class="el" x="1056" y="792" text-anchor="middle">GROQ fetch · webhook revalidates, no redeploy</text>

  <!-- Legend -->
  <line class="rule" x1="56" y1="814" x2="1544" y2="814"/>
  <path class="edge dashed" d="M56 848 H92" marker-end="url(#a)"/><text class="lg" x="102" y="853">Build time</text>
  <path class="edge" d="M232 848 H268" marker-end="url(#a)"/><text class="lg" x="278" y="853">Request time</text>
  <g class="num"><circle cx="560" cy="848" r="12"/><text x="560" y="853" text-anchor="middle" style="font-size:13px">1</text></g><text class="lg" x="580" y="853">Push</text>
  <g class="num"><circle cx="660" cy="848" r="12"/><text x="660" y="853" text-anchor="middle" style="font-size:13px">2</text></g><text class="lg" x="680" y="853">Prerender</text>
  <g class="num"><circle cx="805" cy="848" r="12"/><text x="805" y="853" text-anchor="middle" style="font-size:13px">3</text></g><text class="lg" x="825" y="853">Atomic deploy</text>
  <g class="num"><circle cx="987" cy="848" r="12"/><text x="987" y="853" text-anchor="middle" style="font-size:13px">4</text></g><text class="lg" x="1007" y="853">Request</text>
  <g class="num"><circle cx="1113" cy="848" r="12"/><text x="1113" y="853" text-anchor="middle" style="font-size:13px">5</text></g><text class="lg" x="1133" y="853">Stream</text>
  <g class="num"><circle cx="1230" cy="848" r="12"/><text x="1230" y="853" text-anchor="middle" style="font-size:13px">6</text></g><text class="lg" x="1250" y="853">Add to cart</text>
  <g class="num"><circle cx="1393" cy="848" r="12"/><text x="1393" y="853" text-anchor="middle" style="font-size:13px">7</text></g><text class="lg" x="1413" y="853">Publish</text>
</svg>
</body>
</html>
