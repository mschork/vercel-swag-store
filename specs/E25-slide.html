  <title id="t">Testimonial agent, architecture on one slide</title>
  <desc id="d">The visitor's browser talks to the Next.js store, which runs one Vercel Workflow per submission. The run uses AI Gateway for the vision model, Blob for private photos, Resend for email, and writes to Sanity, where an editor decides; a Sanity Function resumes the run and a webhook revalidates the store.</desc>
