version: 2

# Routine updates come once a week, grouped into one pull request per
# ecosystem so the store does not collect a branch per package. Majors are
# left out: Next, React, Sanity and Tailwind each need their own epic, and a
# security fix arrives through Dependabot's security updates whatever this
# schedule says.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: 'Fix'
      include: scope
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'Fix'
    groups:
      actions:
        patterns: ['*']
